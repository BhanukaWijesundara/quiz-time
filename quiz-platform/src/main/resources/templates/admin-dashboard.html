<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container dashboard-container">
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" aria-label="Sidebar Navigation">
            <div class="sidebar-brand">Quiz Time</div>

            <nav class="sidebar-nav">
                <a th:href="@{/admin/dashboard}"
                   class="sidebar-link"
                   id="nav-admin-dashboard">
                    <span class="sidebar-link-label">Dashboard</span>
                </a>

                <a th:href="@{/admin/quiz/create}"
                   class="sidebar-link"
                   id="nav-admin-create-quiz">
                    <span class="sidebar-link-label">Create Quiz</span>
                </a>

                <a th:if="${quizzes != null and !quizzes.isEmpty()}"
                   th:href="@{/admin/quiz/{id}/submissions(id=${quizzes[0].id})}"
                   class="sidebar-link"
                   id="nav-admin-submissions">
                    <span class="sidebar-link-label">Submissions</span>
                </a>

                <span th:if="${quizzes == null or quizzes.isEmpty()}"
                      class="sidebar-link sidebar-link-disabled"
                      id="nav-admin-submissions">
                    <span class="sidebar-link-label">Submissions</span>
                </span>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-main-header">
                <div>
                    <h2>Admin Dashboard</h2>
                    <p style="margin-top:8px; color:#666;">Manage your quizzes and view submissions</p>
                </div>

                <div class="dashboard-actions">
                    <form th:action="@{/admin/dashboard}" method="get" class="dashboard-search-form">
                           <input type="text"
                               name="search"
                               placeholder="Search quizzes..."
                               th:value="${search}"
                               class="form-control"
                               style="padding:6px 10px; border-radius:4px; border:1px solid #ccc;" />
                        <button type="submit" class="btn btn-secondary">Search</button>
                    </form>

                    <a th:href="@{/admin/profile}" class="btn btn-secondary">Profile</a>
                </div>
            </div>

            <div class="dashboard-content">
                <div th:if="${errorMessage != null}" class="card" style="background:#ffe0e0; color:#a00;">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div th:if="${#lists.isEmpty(quizzes)}" class="card">
                    <p>No quizzes created yet.</p>
                </div>

                <div th:each="quiz : ${quizzes}" class="card">
                    <div class="quiz-title" th:text="${quiz.title}"></div>

                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <a th:href="@{/admin/quiz/{id}/add-question(id=${quiz.id})}" class="btn btn-secondary">
                            Manage Questions
                        </a>

                        <a th:href="@{/admin/quiz/{id}/submissions(id=${quiz.id})}" class="btn btn-success">
                            View Submissions
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Highlight active sidebar item (client-side to avoid server-side template errors).
    document.addEventListener('DOMContentLoaded', function () {
        const path = window.location.pathname || '';
        const dashboard = document.getElementById('nav-admin-dashboard');
        const createQuiz = document.getElementById('nav-admin-create-quiz');
        const submissions = document.getElementById('nav-admin-submissions');

        [dashboard, createQuiz, submissions].forEach(el => el && el.classList.remove('active'));

        if (path === '/admin/dashboard') {
            if (dashboard) dashboard.classList.add('active');
        } else if (path === '/admin/quiz/create') {
            if (createQuiz) createQuiz.classList.add('active');
        } else if (path.startsWith('/admin/quiz/') && path.endsWith('/submissions')) {
            if (submissions) submissions.classList.add('active');
        }
    });
</script>

</body>
</html>
