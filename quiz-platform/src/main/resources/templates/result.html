<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Time | Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container auth-container" style="max-width:650px;">
    <h1 class="site-title">Quiz Time</h1>
    <h2>Quiz Submitted Successfully</h2>
    <p class="page-subtitle">Here is your result summary.</p>

    <div class="card" style="margin-top:20px; text-align:center;">
        <p style="margin:0 0 10px 0;">Your Score</p>
        <div style="font-size:36px; font-weight:700; color:#4f46e5;">
            <span th:text="${score}"></span> / <span th:text="${total}"></span>
        </div>
    </div>

    <div class="card" style="margin-top:20px;">
        <p><strong>Student Email:</strong> <span th:text="${studentEmail}"></span></p>
        <p><strong>Submitted At:</strong> <span th:text="${submittedAt}"></span></p>
    </div>

    <div class="form-actions" style="margin-top:20px;">
        <a th:href="@{/student/dashboard}" class="btn btn-primary">Back to Dashboard</a>
        <a th:href="@{/student/history}" class="btn btn-secondary">View History</a>
    </div>
</div>

</body>
</html>
