<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Time | Add Question</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container">
    <div class="top-bar">
        <div>
            <h2>Add Question</h2>
            <p class="page-subtitle">Add single-answer or multiple-answer questions.</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

        <form th:action="${editMode} ? @{'/admin/quiz/' + ${quizId} + '/edit-question/' + ${question.id}} : @{'/admin/quiz/' + ${quizId} + '/add-question'}"
            th:object="${question}"
            method="post"
            class="form-card modern-form"
            style="margin-top:20px;">
        <div class="floating-field">
            <textarea th:field="*{questionText}" rows="4" placeholder=" " required class="form-control"></textarea>
            <label>Question Text</label>
        </div>
        <div class="form-grid form-grid-2">
            <div class="floating-field">
                <input type="text" th:field="*{optionA}" placeholder=" " required class="form-control" />
                <label>Option A</label>
            </div>
            <div class="floating-field">
                <input type="text" th:field="*{optionB}" placeholder=" " required class="form-control" />
                <label>Option B</label>
            </div>
            <div class="floating-field">
                <input type="text" th:field="*{optionC}" placeholder=" " required class="form-control" />
                <label>Option C</label>
            </div>
            <div class="floating-field">
                <input type="text" th:field="*{optionD}" placeholder=" " required class="form-control" />
                <label>Option D</label>
            </div>
        </div>
        <div class="form-group">
            <label class="field-label">Question Type</label>
            <select th:field="*{multipleCorrect}" class="form-control">
                <option th:value="false">Single Correct Answer</option>
                <option th:value="true">Multiple Correct Answers</option>
            </select>
        </div>
        <div class="floating-field">
            <input type="text" th:field="*{correctAnswers}" placeholder=" " required class="form-control" />
            <label>Correct Answer(s)</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success" th:text="${editMode} ? 'Update Question' : 'Add Question'"></button>
            <a th:if="${editMode}" th:href="@{/admin/quiz/{quizId}/add-question(quizId=${quizId})}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <div style="margin-top:30px;">
        <h3>Added Questions</h3>

        <div th:if="${#lists.isEmpty(questions)}" class="card">
            <p>No questions added yet.</p>
        </div>

        <div th:each="q : ${questions}" class="card">
            <div class="quiz-title" th:text="${q.questionText}"></div>
            <p><strong>Option A:</strong> <span th:text="${q.optionA}"></span></p>
            <p><strong>Option B:</strong> <span th:text="${q.optionB}"></span></p>
            <p><strong>Option C:</strong> <span th:text="${q.optionC}"></span></p>
            <p><strong>Option D:</strong> <span th:text="${q.optionD}"></span></p>
            <p><strong>Correct:</strong> <span th:text="${q.correctAnswers}"></span></p>
            <p><strong>Type:</strong> <span th:text="${q.multipleCorrect} ? 'Multiple' : 'Single'"></span></p>
            <div class="form-actions" style="margin-top:10px;">
                <a th:href="@{'/admin/quiz/' + ${quizId} + '/edit-question/' + ${q.id}}" class="btn btn-warning">Edit</a>
                <form th:action="@{'/admin/quiz/' + ${quizId} + '/delete-question/' + ${q.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this question?');">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
