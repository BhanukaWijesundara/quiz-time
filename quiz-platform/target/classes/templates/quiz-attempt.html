<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Time | Attempt Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container" style="max-width: 900px; margin-top: 30px;">

    <div class="top-bar" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h2>Quiz Attempt</h2>
            <p class="page-subtitle">Answer all questions and submit your quiz.</p>
        </div>
        <div style="display:flex; align-items:center; gap:18px;">
            <div id="timerBox" style="background:#232946; color:#fff; border-radius:8px; padding:8px 18px; font-size:1.2rem; font-family:monospace; font-weight:600;">
                <span>Time Left: </span>
                <span id="timerDisplay" th:text="${duration != null} ? ${duration} + ':00' : '10:00'"></span>
            </div>
            <a th:href="@{/student/dashboard}" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(questions)}" class="card" style="margin-top:20px; padding:20px;">
        <p>No questions available for this quiz yet.</p>
    </div>

    <form th:if="${!#lists.isEmpty(questions)}"
          id="quizForm"
          th:action="@{/student/quiz/{quizId}/submit(quizId=${quizId})}"
          method="post"
          style="margin-top:20px;">

        <div th:each="question, iterStat : ${questions}" class="question-box quiz-question"
             style="margin-bottom:20px; padding:20px; border:1px solid #ddd; border-radius:10px;">

            <div class="quiz-title" style="font-size:18px; font-weight:600;">
                Question <span th:text="${iterStat.index + 1}"></span>
            </div>

            <p style="margin-top: 10px; margin-bottom: 16px; font-weight: 500;"
               th:text="${question.questionText}"></p>

            <div class="options-container">
                <div class="option" style="margin-bottom:10px;">
                    <label>
                        <input type="checkbox"
                               th:name="'answers[' + ${question.id} + ']'"
                               value="A">
                        <span th:text="${question.optionA}"></span>
                    </label>
                </div>

                <div class="option" style="margin-bottom:10px;">
                    <label>
                        <input type="checkbox"
                               th:name="'answers[' + ${question.id} + ']'"
                               value="B">
                        <span th:text="${question.optionB}"></span>
                    </label>
                </div>

                <div class="option" style="margin-bottom:10px;">
                    <label>
                        <input type="checkbox"
                               th:name="'answers[' + ${question.id} + ']'"
                               value="C">
                        <span th:text="${question.optionC}"></span>
                    </label>
                </div>

                <div class="option" style="margin-bottom:10px;">
                    <label>
                        <input type="checkbox"
                               th:name="'answers[' + ${question.id} + ']'"
                               value="D">
                        <span th:text="${question.optionD}"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="form-actions" style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn btn-primary">Submit Quiz</button>
            <a th:href="@{/student/dashboard}" class="btn btn-secondary">Back</a>
        </div>
    </form>
</div>

<script>
        // Hide back button and redirect to login if user tries to go back
        (function() {
            if (window.history && window.history.pushState) {
                window.history.pushState(null, '', window.location.href);
                window.history.replaceState(null, '', window.location.href);
                let block = true;
                window.addEventListener('popstate', function(event) {
                    if (block) {
                        window.location.href = '/login';
                    }
                });
                // Block navigation away (refresh/close)
                window.addEventListener('beforeunload', function(e) {
                    e.preventDefault();
                    e.returnValue = '';
                });
                // Remove block on submit
                var quizForm = document.getElementById('quizForm');
                if (quizForm) {
                    quizForm.addEventListener('submit', function() {
                        block = false;
                    });
                }
            }
            // Hide browser back button (UI)
            var style = document.createElement('style');
            style.innerHTML = '[data-back-button], .back-button, .btn-back, .fa-arrow-left { display: none !important; }';
            document.head.appendChild(style);
        })();
    // Timer and state persistence logic
    document.addEventListener('DOMContentLoaded', function () {
        var quizId = document.querySelector('form[th\\:action]')?.getAttribute('th:action')?.match(/quiz\\/(\\d+)\\//);
        quizId = quizId ? quizId[1] : (window.quizId || '');
        var duration = /*[[${duration}]]*/ 10; // fallback 10 min
        var timerDisplay = document.getElementById('timerDisplay');
        var quizForm = document.getElementById('quizForm');
        var storageKey = 'quiz_state_' + quizId;

        // Restore state if exists
        var state = sessionStorage.getItem(storageKey);
        var totalSeconds = duration * 60;
        if (state) {
            try {
                var parsed = JSON.parse(state);
                if (parsed.remaining > 0) {
                    totalSeconds = parsed.remaining;
                    // Restore answers
                    if (parsed.answers) {
                        Object.entries(parsed.answers).forEach(function([name, values]) {
                            values.forEach(function(val) {
                                var input = document.querySelector('input[name="' + name + '"][value="' + val + '"]');
                                if (input) input.checked = true;
                            });
                        });
                    }
                }
            } catch(e) {}
        }

        // Save state on change
        function saveState() {
            var answers = {};
            document.querySelectorAll('input[type=checkbox]:checked').forEach(function(input) {
                if (!answers[input.name]) answers[input.name] = [];
                answers[input.name].push(input.value);
            });
            sessionStorage.setItem(storageKey, JSON.stringify({remaining: totalSeconds, answers: answers}));
        }
        document.querySelectorAll('input[type=checkbox]').forEach(function(input) {
            input.addEventListener('change', saveState);
        });

        // Timer logic
        var timerInterval = setInterval(function () {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = '00:00';
                if (quizForm) quizForm.submit();
                sessionStorage.removeItem(storageKey);
                return;
            }
            totalSeconds--;
            var m = Math.floor(totalSeconds / 60);
            var s = totalSeconds % 60;
            timerDisplay.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            saveState();
        }, 1000);

        // Remove state on submit
        if (quizForm) {
            quizForm.addEventListener('submit', function() {
                sessionStorage.removeItem(storageKey);
            });
        }
    });
</script>
</body>
</html>
