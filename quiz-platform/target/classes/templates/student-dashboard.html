<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container dashboard-container">
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" aria-label="Sidebar Navigation">
            <div class="sidebar-brand">Quiz Time</div>

            <nav class="sidebar-nav">
                <a th:href="@{/student/dashboard}"
                   class="sidebar-link"
                   id="nav-student-dashboard">
                    <span class="sidebar-link-label">Dashboard</span>
                </a>
                <a th:href="@{/student/history}"
                   class="sidebar-link"
                   id="nav-student-history">
                    <span class="sidebar-link-label">History</span>
                </a>
                <a th:href="@{/user/profile}"
                   class="sidebar-link"
                   id="nav-student-profile">
                    <span class="sidebar-link-label">Profile</span>
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-main-header">
                <div>
                    <h2>Student Dashboard</h2>
                    <p style="color:#666;">Select a quiz to start</p>
                </div>

                <div class="dashboard-actions">
                    <form th:action="@{/student/dashboard}" method="get" class="dashboard-search-form">
                        <input type="text"
                               name="search"
                               placeholder="Search quizzes..."
                               th:value="${param.search}"
                               class="form-control"
                               style="padding:6px 10px; border-radius:4px; border:1px solid #ccc;" />
                        <button type="submit" class="btn btn-secondary">Search</button>
                    </form>
                </div>
            </div>

            <div class="dashboard-content">
                <div class="quiz-grid">
                    <div th:each="quiz : ${quizzes}" class="quiz-card">
                        <div class="quiz-icon">
                            <span>📝</span>
                        </div>
                        <div class="quiz-info">
                            <div class="quiz-title" th:text="${quiz.title}"></div>
                        </div>
                        <a th:href="@{/student/quiz/{id}(id=${quiz.id})}" class="btn btn-primary quiz-btn">
                            Start Quiz
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Highlight active sidebar item (client-side to avoid server-side template errors).
    document.addEventListener('DOMContentLoaded', function () {
        const path = window.location.pathname || '';
        const dashboard = document.getElementById('nav-student-dashboard');
        const history = document.getElementById('nav-student-history');
        [dashboard, history].forEach(el => el && el.classList.remove('active'));

        if (path === '/student/history') {
            if (history) history.classList.add('active');
        } else if (path === '/student/dashboard') {
            if (dashboard) dashboard.classList.add('active');
        }
    });
</script>

</body>
</html>
