<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div th:replace="fragments/header :: div"></div>
<div class="container">
    <div class="top-bar">
        <div>
            <h2>Analytics Dashboard</h2>
            <p class="page-subtitle">Quiz performance and student stats</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
    <div class="card" style="margin-top:20px;">
        <h3>Average Score per Quiz</h3>
        <canvas id="avgScoreChart" height="100"></canvas>
    </div>
    <div class="card" style="margin-top:20px;">
        <h3>Number of Attempts per Quiz</h3>
        <canvas id="attemptsChart" height="100"></canvas>
    </div>
    <div class="card" style="margin-top:20px;">
        <h3>Top Students</h3>
        <table>
            <thead>
            <tr><th>Student Email</th><th>Total Score</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${topStudents}">
                <td th:text="${s[0]}"></td>
                <td th:text="${s[1]}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:inline="javascript">
    const quizTitles = [[${quizTitles}]];
    const avgScores = [[${avgScores}]];
    const attempts = [[${attempts}]];
    new Chart(document.getElementById('avgScoreChart'), {
        type: 'bar',
        data: {
            labels: quizTitles,
            datasets: [{
                label: 'Average Score',
                data: avgScores,
                backgroundColor: 'rgba(54, 162, 235, 0.6)'
            }]
        },
        options: {responsive: true, plugins: {legend: {display: false}}}
    });
    new Chart(document.getElementById('attemptsChart'), {
        type: 'bar',
        data: {
            labels: quizTitles,
            datasets: [{
                label: 'Attempts',
                data: attempts,
                backgroundColor: 'rgba(255, 99, 132, 0.6)'
            }]
        },
        options: {responsive: true, plugins: {legend: {display: false}}}
    });
</script>
</body>
</html>
