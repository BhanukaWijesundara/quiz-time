<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments/header :: div"></div>

<div class="container">

    <div class="card" style="max-width:500px;margin:40px auto;">
        <h2>Admin Profile</h2>
        <div th:if="${user != null}">
            <div style="text-align:center; margin-bottom:20px;">
                <img th:if="${user.profilePicture != null}"
                     th:src="@{/images/profile/{file}(file=${user.profilePicture})}"
                     alt="Profile Picture"
                     style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid #888;" />
                <div th:if="${user.profilePicture == null}" style="width:120px;height:120px;border-radius:50%;background:#eee;display:inline-block;line-height:120px;font-size:48px;color:#aaa;">👤</div>
            </div>
            <form th:action="@{/admin/profile/upload-picture}" method="post" enctype="multipart/form-data" style="margin-bottom:20px; text-align:center;">
                <input type="file" name="profilePicture" accept="image/*" required />
                <button type="submit" class="btn btn-secondary">Upload Picture</button>
            </form>
            <p><strong>Name:</strong> <span th:text="${user.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
            <div th:if="${uploadError != null}" style="color:red;">[[${uploadError}]]</div>
        </div>
        <div th:if="${user == null}">
            <p>User not found.</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
