<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Departments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container dashboard-container">
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" aria-label="Sidebar Navigation">
            <div class="sidebar-brand">Quiz Time</div>

            <nav class="sidebar-nav">
                <a th:href="@{/admin/dashboard}" class="sidebar-link" id="nav-admin-dashboard">
                    <span class="sidebar-link-label">Dashboard</span>
                </a>

                <a th:href="@{/admin/manage-quizzes}" class="sidebar-link" id="nav-admin-manage-quizzes">
                    <span class="sidebar-link-label">Manage Quizzes</span>
                </a>

                <a th:href="@{/admin/quiz/create}" class="sidebar-link" id="nav-admin-create-quiz">
                    <span class="sidebar-link-label">Create Quiz</span>
                </a>

                <a th:href="@{/admin/departments}" class="sidebar-link" id="nav-admin-departments">
                    <span class="sidebar-link-label">Departments</span>
                </a>

                <a th:href="@{/admin/profile}" class="sidebar-link" id="nav-admin-profile">
                    <span class="sidebar-link-label">Profile</span>
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="dashboard-main-header">
                <div>
                    <h2>Manage Departments</h2>
                    <p style="color:#666;">Add and view departments</p>
                </div>
            </div>

            <div class="dashboard-content">
                <div class="card" style="margin-bottom:20px;">
                    <h3>Add Department</h3>

                    <div th:if="${errorMessage != null}" style="color:red; margin-bottom:10px;" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage != null}" style="color:green; margin-bottom:10px;" th:text="${successMessage}"></div>

                    <form th:action="@{/admin/departments/add}" method="post">
                        <input type="text" name="name" placeholder="Enter department name" class="form-control" required>
                        <button type="submit" class="btn btn-primary">Add Department</button>
                    </form>
                </div>

                <div class="card">
                    <h3>Available Departments</h3>

                    <div th:if="${#lists.isEmpty(departments)}">
                        <p>No departments added yet.</p>
                    </div>

                    <table th:if="${!#lists.isEmpty(departments)}">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Department Name</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="dept : ${departments}">
                            <td th:text="${dept.id}"></td>
                            <td th:text="${dept.name}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const departments = document.getElementById('nav-admin-departments');
        if (departments) departments.classList.add('active');
    });
</script>

</body>
</html>
