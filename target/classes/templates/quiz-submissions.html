<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Quiz Time | Quiz Submissions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: div"></div>

<div class="container">
  <div class="top-bar">
    <div>
      <h2>Quiz Submissions</h2>
      <p class="muted-text">View all student attempts for this quiz</p>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
  </div>

  <div th:if="${#lists.isEmpty(submissions)}" class="card" style="margin-top: 20px;">
    <p>No submissions found for this quiz yet.</p>
  </div>

  <div th:if="${!#lists.isEmpty(submissions)}" class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>Student Email</th>
        <th>Score</th>
        <th>Total</th>
        <th>Submitted At</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="submission : ${submissions}">
        <td th:text="${submission.studentEmail}"></td>
        <td th:text="${submission.score}"></td>
        <td th:text="${submission.totalQuestions}"></td>
        <td th:text="${submission.submittedAt}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
