<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Time | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container auth-container">
    <h1 class="site-title">Quiz Time</h1>
    <h2>Register</h2>
    <p class="page-subtitle">Create your account to start taking quizzes.</p>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="form-card modern-form" style="margin-top:20px;">
        <div class="floating-field">
            <input type="text" th:field="*{fullName}" placeholder=" " required class="form-control" autocomplete="name" />
            <label>Full Name</label>
        </div>
        <div class="floating-field">
            <input type="email" th:field="*{email}" placeholder=" " required class="form-control" autocomplete="email" />
            <label>Email</label>
        </div>
        <div class="floating-field">
            <input type="password" th:field="*{password}" placeholder=" " required class="form-control" autocomplete="new-password" />
            <label>Password</label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Register</button>
            <a th:href="@{/login}" class="btn btn-secondary">Back to Login</a>
        </div>
    </form>
</div>

</body>
</html>
